<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrapper header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/archive/' | relative_url }}">Archive</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
    </header>

    <main class="wrapper" id="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrapper footer-inner">
        <p>{{ site.description | escape }}</p>
        <p>
          {% if site.github_username %}<a href="https://github.com/{{ site.github_username | cgi_escape }}">GitHub</a><span aria-hidden="true"> · </span>{% endif %}
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </p>
        <p class="footer-license">
          <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
            <img src="https://i.creativecommons.org/l/by-nc-sa/4.0/88x31.png" alt="Creative Commons Attribution-NonCommercial-ShareAlike 4.0 International License">
          </a>
          <span>Except where otherwise noted, content is licensed under <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.</span>
        </p>
      </div>
    </footer>
  </body>
</html>
